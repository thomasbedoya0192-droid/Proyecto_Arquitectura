services:

  db:
    image: postgres:15
    container_name: postgres_core
    restart: unless-stopped
    environment:
      - POSTGRES_USER=core_user
      - POSTGRES_PASSWORD=core_pass
      - POSTGRES_DB=core
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_user -d core"]
      interval: 5s
      timeout: 5s
      retries: 5

  payments-db:
    image: postgres:15
    container_name: postgres_payments
    restart: unless-stopped
    environment:
      - POSTGRES_USER=payments_user
      - POSTGRES_PASSWORD=payments_pass
      - POSTGRES_DB=payments
    volumes:
      - postgres_payments_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments_user -d payments"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_worker
    restart: unless-stopped
    command: ["celery", "-A", "core", "worker", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["async"]
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DATABASE_URL=postgresql://core_user:core_pass@db:5432/core
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - DJANGO_SETTINGS_MODULE=core.settings

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_beat
    restart: unless-stopped
    command: ["celery", "-A", "core", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["async"]
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DATABASE_URL=postgresql://core_user:core_pass@db:5432/core
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - DJANGO_SETTINGS_MODULE=core.settings

  django-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_api
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - 8000
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DATABASE_URL=postgresql://core_user:core_pass@db:5432/core
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - DJANGO_SETTINGS_MODULE=core.settings
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 3

  payments-service:
    build: ./flask-pagos
    container_name: payments_service
    restart: unless-stopped
    expose:
      - 5000
    depends_on:
      payments-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://payments_user:payments_pass@payments-db:5432/payments
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - PREMIUM_PRICE=${PREMIUM_PRICE:-9.99}
      - PREMIUM_PERIOD_DAYS=${PREMIUM_PERIOD_DAYS:-30}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    depends_on:
      django-api:
        condition: service_healthy
      payments-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      - GATEWAY_PORT=${GATEWAY_PORT:-80}
volumes:
  postgres_core_data:
  postgres_payments_data:
