# Upstream configurations
upstream django_api {
    server django-api:8000;
}

upstream payments_service {
    server payments-service:5000;
}

# Main server block
server {
    listen 80;
    server_name localhost;

    # Forward common headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_prog types;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Public API endpoints - payments service
    location ^~/api/v1/public/ {
        proxy_pass http://payments_service;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Django API endpoints
    location ^~/api/ {
        proxy_pass http://django_api;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Admin static files
    location ^~/static/ {
        proxy_pass http://django_api;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Admin endpoint
    location ^~/admin/ {
        proxy_pass http://django_api;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Internal endpoints - must return 404
    location ^~/internal/ {
        return 404;
    }

    # Root - serve SPA
    location / {
        try_files $uri $uri/ /index.html;
        proxy_read_timeout 120s;
    }
}